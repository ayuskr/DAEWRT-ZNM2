name: Auto-Clean

# 只允许手动触发。
# 原先是 workflow_run: Cache-Clean completed，但那种触发方式下 inputs 为空，
# releases_keep_latest 会回落到 '0'，等于每次清缓存都把所有固件发布删光。
on:
  workflow_dispatch:
    inputs:
      NUMBER:
        description: '保留最新几个发布，0 表示全部删除'
        default: '6'
        required: false
        type: string

permissions: write-all

jobs:
  auto_clean:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old Releases and Workflows
        uses: ophub/delete-releases-workflows@main
        with:
          gh_token: ${{secrets.GITHUB_TOKEN}}
          delete_releases: true
          # 默认保留 6 个（三个配置各 2 个），不再出现 0 的情况
          releases_keep_latest: ${{inputs.NUMBER || '6'}}
          delete_tags: true
          delete_workflows: true
          # 保留 7 天运行记录，便于回溯失败原因；原来的 0 会把日志一并删掉
          workflows_keep_day: 7