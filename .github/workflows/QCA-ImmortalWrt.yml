# CI项目（测试分支：ImmortalWrt 源码 / 多机型）
name: QCA-ImmortalWrt

on:
  workflow_run:
    workflows: ["Auto-Clean"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '手动调整插件包，多个请用\n符号隔开。'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: 'false'
        required: false
        type: boolean

permissions: write-all

jobs:
  config:
    name: ${{ matrix.CONFIG }}
    strategy:
      fail-fast: false
      matrix:
        # IPQ60XX-NOWIFI : ZN-M2（京东云亚瑟 AX1800 Pro），编译期移除 WiFi
        # IPQ807X-WIFI-YES: Redmi AX6，保留 WiFi（需先刷 OpenWrt U-Boot）
        CONFIG: [IPQ60XX-NOWIFI, IPQ807X-WIFI-YES]
        SOURCE: [VIKINGYFY/immortalwrt]
        BRANCH: [owrt]

    uses: ./.github/workflows/WRT-CORE.yml
    with:
      WRT_CONFIG: ${{ matrix.CONFIG }}
      WRT_THEME: glass
      WRT_NAME: NERCH_Plus
      WRT_SSID: NERCH_Plus
      WRT_WORD: 8765432101
      WRT_IP: 10.0.0.1
      WRT_PW: 无
      WRT_REPO: https://github.com/${{ matrix.SOURCE }}.git
      WRT_BRANCH: ${{ matrix.BRANCH }}
      WRT_SOURCE: ${{ matrix.SOURCE }}
      WRT_PACKAGE: ${{ inputs.PACKAGE }}
      WRT_TEST: ${{ inputs.TEST }}
      CI_NAME: ${{ github.workflow }}

  # 编译全部结束后统一清理（避免与矩阵 job 并发误删）。
  #
  # 规则：
  #   1. TEST 空包（描述里「内核版本：none」）一律删除；
  #   2. 按“型号”分组，每个型号各保留最近 2 次编译成功的固件；
  #      —— 防止反复编译某一型号把另一型号挤掉；
  #   3. 不在 ACTIVE_MODELS 里的旧型号（如 IPQ60XX-WIFI、LiBwrt 系列）视为已下线，全部删除。
  cleanup:
    name: Clean Old Releases
    needs: config
    if: always() && !cancelled()
    runs-on: ubuntu-24.04

    steps:
      - name: Keep Latest 2 Successful Releases Per Model
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          KEEP_PER_MODEL: 2
          # 与上方 matrix.CONFIG 保持一致；新增机型时记得同步这里
          ACTIVE_MODELS: IPQ60XX-NOWIFI IPQ807X-WIFI-YES
        run: |
          set -uo pipefail

          gh release list --limit 200 --json tagName,publishedAt \
            --jq 'sort_by(.publishedAt) | reverse | .[] | [.tagName, .publishedAt] | @tsv' \
            > /tmp/releases.tsv

          declare -A seen

          while IFS=$'\t' read -r tag published; do
            [ -z "$tag" ] && continue

            body=$(gh release view "$tag" --json body --jq '.body' 2>/dev/null || echo "")

            # 1. TEST 空包（只有配置、没有固件）
            if echo "$body" | grep -q "内核版本：none"; then
              echo "删除 TEST 空包：$tag"
              gh release delete "$tag" --yes --cleanup-tag || true
              continue
            fi

            # 2. 从 tag 解析型号：QCA-xxx-<MODEL>_<日期> -> <MODEL>
            model=$(echo "$tag" | grep -oP 'IPQ[0-9]+XX-[A-Z-]+(?=_[0-9])' | head -n 1)

            if [ -z "$model" ]; then
              echo "跳过（无法识别型号，未删除）：$tag"
              continue
            fi

            # 3. 已下线型号
            if ! echo "$ACTIVE_MODELS" | tr ' ' '\n' | grep -qx "$model"; then
              echo "删除已下线型号（$model）：$tag"
              gh release delete "$tag" --yes --cleanup-tag || true
              continue
            fi

            # 4. 按型号分别计数，各保留最新 KEEP_PER_MODEL 个
            seen[$model]=$(( ${seen[$model]:-0} + 1 ))
            if [ "${seen[$model]}" -le "$KEEP_PER_MODEL" ]; then
              echo "保留 $model 第 ${seen[$model]} 新：$tag  ($published)"
            else
              echo "删除 $model 旧版本（第 ${seen[$model]} 新）：$tag  ($published)"
              gh release delete "$tag" --yes --cleanup-tag || true
            fi
          done < /tmp/releases.tsv

          echo "======== 清理后剩余 ========"
          gh release list --limit 30