# CI项目（测试分支：ImmortalWrt 源码 / 多机型）
name: QCA-ImmortalWrt

on:
  workflow_run:
    workflows: ["Auto-Clean"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '手动调整插件包，多个请用\n符号隔开。'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: 'false'
        required: false
        type: boolean

permissions: write-all

jobs:
  config:
    name: ${{ matrix.CONFIG }}
    strategy:
      fail-fast: false
      matrix:
        # IPQ60XX-NOWIFI : ZN-M2（京东云亚瑟 AX1800 Pro），编译期移除 WiFi
        # IPQ807X-WIFI-YES: Redmi AX6，保留 WiFi
        CONFIG: [IPQ60XX-NOWIFI, IPQ807X-WIFI-YES]
        SOURCE: [VIKINGYFY/immortalwrt]
        BRANCH: [owrt]

    uses: ./.github/workflows/WRT-CORE.yml
    with:
      WRT_CONFIG: ${{ matrix.CONFIG }}
      WRT_THEME: glass
      WRT_NAME: NERCH_Plus
      WRT_SSID: NERCH_Plus
      WRT_WORD: 8765432101
      WRT_IP: 10.0.0.1
      WRT_PW: 无
      WRT_REPO: https://github.com/${{ matrix.SOURCE }}.git
      WRT_BRANCH: ${{ matrix.BRANCH }}
      WRT_SOURCE: ${{ matrix.SOURCE }}
      WRT_PACKAGE: ${{ inputs.PACKAGE }}
      WRT_TEST: ${{ inputs.TEST }}
      CI_NAME: ${{ github.workflow }}