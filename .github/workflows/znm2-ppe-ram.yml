name: ZNM2 PPE RAM trial
on:
  push:
    branches: [experiment/znm2-ppe]
    paths: ['experimental/ppe/**', '.github/workflows/znm2-ppe-ram.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: openwrt/openwrt
          ref: f8145e65458fba52e360bbdb358be42939eb557f
          path: wrt
          persist-credentials: false
      - name: Prepare build host
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update -qq
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext libncurses-dev libssl-dev python3-setuptools python3-pyelftools rsync swig unzip zlib1g-dev file libelf-dev libfuse-dev xsltproc device-tree-compiler u-boot-tools
      - name: Configure RAM target
        working-directory: wrt
        run: |
          board=target/linux/qualcommax
          install -m644 ../experimental/ppe/ipq6000-m2.dts "$board/dts/"
          cat ../experimental/ppe/device.mk >> "$board/image/ipq60xx.mk"
          install -m755 ../experimental/ppe/03_zn_m2 "$board/ipq60xx/base-files/etc/board.d/"
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cat > .config <<'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq60xx=y
          CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_zn_m2=y
          CONFIG_TARGET_ROOTFS_INITRAMFS=y
          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_kmod-nft-offload=y
          CONFIG_PACKAGE_conntrack=y
          CONFIG_KERNEL_DEBUG_FS=y
          EOF
          make defconfig
          grep -Fx 'CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_zn_m2=y' .config
          grep -Fx 'CONFIG_TARGET_ROOTFS_INITRAMFS=y' .config
      - name: Compile
        working-directory: wrt
        run: |
          make download -j8
          make -j"$(nproc)" || make -j1 V=s
      - name: Collect verified RAM FIT
        run: |
          mkdir out
          shopt -s nullglob
          images=(wrt/bin/targets/qualcommax/ipq60xx/*zn_m2*initramfs*.itb)
          test "${#images[@]}" -eq 1
          fdtget "${images[0]}" /configurations/config@cp03-c1 kernel
          cp "${images[0]}" out/
          cp wrt/.config out/build.config
          cd out && sha256sum *.itb > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: znm2-ppe-ram
          path: out/
          if-no-files-found: error
