name: ZNM2 iStoreOS sysupgrade trial
on:
  push:
    branches: [experiment/znm2-ppe]
    paths: ['.github/workflows/znm2-istoreos.yml', 'experimental/istoreos/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: istoreos/istoreos
          ref: 111a9805445a88833c40d38b628fa0dfd02060c8
          path: wrt
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: LiBwrt/LibWrt
          ref: 000a4e74b17edfdc296f9eaa674344fc0adaaf95
          path: donor
          sparse-checkout: target/linux/qualcommax
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: immortalwrt/homeproxy
          ref: fadaa676104f59ff6ace480a780a258d846d0aec
          path: hp
          persist-credentials: false
      - name: Prepare runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update -qq
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext libncurses-dev libssl-dev python3-setuptools python3-pyelftools rsync swig unzip zlib1g-dev file libelf-dev libfuse-dev xsltproc device-tree-compiler u-boot-tools
      - name: Integrate board and feeds
        working-directory: wrt
        run: |
          set -euo pipefail
          python3 ../experimental/istoreos/board.py
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          ./scripts/feeds install -p store taskd luci-lib-xterm luci-lib-taskd luci-app-store
          for pkg in taskd luci-lib-xterm luci-lib-taskd luci-app-store; do
            test -f "package/feeds/store/$pkg/Makefile" || { echo "::error::Missing feed recipe for $pkg"; exit 1; }
          done
          recipe=feeds/packages/net/sing-box/Makefile
          grep -Fxq '$(eval $(call BuildPackage,sing-box))' "$recipe"
          sed -i '/^$(eval $(call BuildPackage,sing-box-tiny))$/d' "$recipe"
          find package/feeds -type l -name luci-app-weechat -print -delete
          mkdir -p package/custom/luci-app-homeproxy
          rsync -a --exclude=.git ../hp/ package/custom/luci-app-homeproxy/
          rm -rf tmp
          cp ../experimental/istoreos/znm2.config .config
          echo 'CONFIG_PACKAGE_sing-box=y' >> .config
          make defconfig 2>&1 | tee "$RUNNER_TEMP/znm2-defconfig.log"
          if grep -Fq 'recursive dependency detected' "$RUNNER_TEMP/znm2-defconfig.log"; then
            echo '::error::Kconfig dependency cycle in package metadata'
            exit 1
          fi
          failed=0
          for sym in $(sed -n 's/^CONFIG_\(.*\)=y$/\1/p' ../experimental/istoreos/znm2.config) PACKAGE_sing-box; do
            if ! grep -Fxq "CONFIG_${sym}=y" .config; then
              echo "::error::Missing required config: CONFIG_${sym}=y"
              grep -F "$sym" .config || true
              awk -v key="$sym" '$1=="config" || $1=="menuconfig" {show=($2==key)} show {print}' tmp/.config-package.in
              failed=1
            fi
          done
          exit "$failed"
      - name: Preserve configuration evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: znm2-config-diagnostics
          include-hidden-files: true
          path: |
            wrt/.config
            wrt/tmp/.config-package.in
            wrt/tmp/.packageinfo
      - name: Compile native sysupgrade image
        working-directory: wrt
        run: |
          make download -j8
          make -j"$(nproc)" || make -j1 V=s
      - name: Check image metadata and contents
        run: |
          set -euo pipefail
          shopt -s nullglob
          images=(wrt/bin/targets/qualcommax/ipq60xx/*zn_m2*sysupgrade.bin)
          test "${#images[@]}" -eq 1
          mkdir out
          wrt/staging_dir/host/bin/fwtool -i out/metadata.json "${images[0]}"
          jq -e '.supported_devices | index("zn,m2") != null' out/metadata.json
          tar -tf "${images[0]}" > out/members.txt
          grep -Eq '^sysupgrade-[^/]+/kernel$' out/members.txt
          grep -Eq '^sysupgrade-[^/]+/root$' out/members.txt
          cp "${images[0]}" wrt/bin/targets/qualcommax/ipq60xx/*.manifest out/
          cp wrt/.config out/build.config
          cd out && sha256sum *.bin > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: znm2-istoreos-25.12-sysupgrade-experimental
          path: out/
          if-no-files-found: error
